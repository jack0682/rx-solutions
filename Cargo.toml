[workspace]
members = ["runtime/rx-host", "runtime/rx-solution-catalog", "runtime/rx-process", "runtime/rx-executor", "runtime/rx-supervisor", "runtime/rx-process-package", "runtime/rx-device-package", "drivers/rx-melsec-mc"]
exclude = ["sdk"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
