service CellService {
  rpc Open (.rx.cell.v1.CellHello) returns (.rx.cell.v1.CellSession);
  rpc Inspect (.rx.cell.v1.CellCall) returns (.rx.cell.v1.CellContext);
  rpc Evaluate (.rx.cell.v1.EvaluateRequest) returns (.rx.cell.v1.EvaluationSet);
  rpc StartRun (.rx.cell.v1.StartRunRequest) returns (.rx.cell.v1.StartAttempt);
  rpc GetStartAttempt (.rx.cell.v1.GetStartAttemptRequest) returns (.rx.cell.v1.StartAttempt);
  rpc BeginPartAttempt (.rx.cell.v1.BeginPartAttemptRequest) returns (.rx.cell.v1.PartAttempt);
  rpc SubmitOperation (.rx.cell.v1.SubmitOperationRequest) returns (.rx.contract.v1.Receipt);
  rpc Hold (.rx.cell.v1.HoldRequest) returns (.rx.cell.v1.CellContext);
  rpc ClearTransientBlock (.rx.cell.v1.ClearTransientBlockRequest) returns (.rx.cell.v1.CellContext);
  rpc OpenCase (.rx.cell.v1.OpenCaseRequest) returns (.rx.cell.v1.InterventionCase);
  rpc RecordProcedure (.rx.cell.v1.RecordProcedureRequest) returns (.rx.cell.v1.InterventionCase);
  rpc SetRecoveryPlan (.rx.cell.v1.SetRecoveryPlanRequest) returns (.rx.cell.v1.InterventionCase);
  rpc PrepareRestart (.rx.cell.v1.PrepareRestartRequest) returns (.rx.cell.v1.RestartPreparation);
  rpc GetRestartPreparation (.rx.cell.v1.GetRestartPreparationRequest) returns (.rx.cell.v1.RestartPreparation);
  rpc PrepareClose (.rx.cell.v1.PrepareCloseRequest) returns (.rx.cell.v1.Clearance);
  rpc RestartRun (.rx.cell.v1.RestartRunRequest) returns (.rx.cell.v1.StartAttempt);
  rpc CloseWithoutRestart (.rx.cell.v1.CloseWithoutRestartRequest) returns (.rx.cell.v1.CellContext);
  rpc RecordChange (.rx.cell.v1.RecordChangeRequest) returns (.rx.cell.v1.ChangeRecord);
  rpc RegisterQualification (.rx.cell.v1.RegisterQualificationRequest) returns (.rx.cell.v1.Qualification);
  rpc GetCase (.rx.cell.v1.GetCaseRequest) returns (.rx.cell.v1.InterventionCase);
  rpc GetMaterial (.rx.cell.v1.GetMaterialRequest) returns (.rx.cell.v1.MaterialState);
}

message HostFenceCellRequest {
  CellCall call = 1;
  CellRef target = 2;
  repeated string block_ids = 3;
  string invalidation_id = 4;
}

message HostArmCellRequest {
  CellCall call = 1;
  string attempt_id = 2;
  CellRef target = 3;
  repeated string clearance_ids = 4;
  repeated string block_ids_to_clear = 5;
}

message HostPrepareRequest {
  CellCall call = 1;
  rx.contract.v1.PrepareOperation base_request = 2;
  DispatchPermit permit = 3;
}

message HostAuthorizeRequest {
  CellCall call = 1;
  rx.contract.v1.AuthorizeDispatch base_request = 2;
  DispatchPermit permit = 3;
}

service CellHostService {
  rpc Inspect (.rx.cell.v1.CellCall) returns (.rx.cell.v1.HostCellState);
  rpc FenceCell (.rx.cell.v1.HostFenceCellRequest) returns (.rx.cell.v1.FenceReceipt);
  rpc ArmCell (.rx.cell.v1.HostArmCellRequest) returns (.rx.cell.v1.ArmReceipt);
  rpc Prepare (.rx.cell.v1.HostPrepareRequest) returns (.rx.contract.v1.Receipt);
  rpc Authorize (.rx.cell.v1.HostAuthorizeRequest) returns (.rx.contract.v1.Receipt);
}

message SnapshotEntity {
  oneof value {
    rx.contract.v1.EntityView base_entity = 1;
    CellEntity cell_entity = 2;
  }
}

message CellSnapshot {
  string snapshot_id = 1;
  rx.contract.v1.Cursor through = 2;
  repeated SnapshotEntity entities = 3;
  optional string continuation = 4;
}

service CellJournalService {
  rpc GetSnapshot (.rx.contract.v1.SubscribeRequest) returns (.rx.cell.v1.CellSnapshot);
  rpc GetSnapshotPage (.rx.contract.v1.SnapshotPageRequest) returns (.rx.cell.v1.CellSnapshot);
  rpc Subscribe (.rx.contract.v1.SubscribeRequest) returns (stream .rx.cell.v1.CellJournalRecord);
}
