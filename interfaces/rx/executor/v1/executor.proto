syntax = "proto3";
package rx.executor.v1;
import "rx/contract/v1/contract.proto";
// Generated by tools/generate_protocol.py. Preserve contract field numbers.

message SnapshotRequest {
  rx.contract.v1.CallContext context = 1;
  string run_id = 2;
  uint64 visit = 3;
  bytes binding_hash = 4;
}

message ArtifactRequest {
  rx.contract.v1.CallContext context = 1;
  string run_id = 2;
  rx.contract.v1.ArtifactRef reference = 3;
  bytes binding_hash = 4;
}

message ReadPayload {
  rx.contract.v1.ArtifactRef reference = 1;
  bytes payload = 2;
}

service ExecutorReadService {
  rpc GetSnapshot (.rx.executor.v1.SnapshotRequest) returns (.rx.executor.v1.ReadPayload);
  rpc GetArtifact (.rx.executor.v1.ArtifactRequest) returns (.rx.executor.v1.ReadPayload);
}
