[package]
license.workspace = true
name = "rx-supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
rx-package = {path="../../sdk/crates/rx-package"}
rx-domain = {path="../../sdk/crates/rx-domain"}
rx-ports = {path="../../sdk/crates/rx-ports"}
rx-storage = {path="../../sdk/crates/rx-storage"}
rx-solution-catalog = {path="../rx-solution-catalog"}
rx-service-status = {path="../rx-service-status"}
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10"
uuid = {version="1",features=["v4"]}
thiserror = "2"
tokio = {version="1",features=["macros","rt","signal","time"]}
[dev-dependencies]
tempfile = "3"
[lints]
workspace = true
