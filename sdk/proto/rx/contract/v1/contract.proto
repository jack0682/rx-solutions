service SessionService {
  rpc Open (.rx.contract.v1.PeerHello) returns (.rx.contract.v1.Session);
}

service OperationService {
  rpc Submit (.rx.contract.v1.SubmitOperation) returns (.rx.contract.v1.Receipt);
  rpc Get (.rx.contract.v1.OperationRef) returns (.rx.contract.v1.OperationView);
  rpc Lookup (.rx.contract.v1.CallContext) returns (.rx.contract.v1.Receipt);
  rpc RequestCancel (.rx.contract.v1.CancelRequest) returns (.rx.contract.v1.OperationView);
  rpc Reconcile (.rx.contract.v1.OperationRef) returns (.rx.contract.v1.OperationView);
}

service RecoveryService {
  rpc RecordDisposition (.rx.contract.v1.RecoveryDisposition) returns (.rx.contract.v1.OperationView);
}

service WorkflowService {
  rpc CreateRun (.rx.contract.v1.RunRequest) returns (.rx.contract.v1.RunView);
  rpc StartRun (.rx.contract.v1.RunRequest) returns (.rx.contract.v1.RunView);
  rpc PauseRun (.rx.contract.v1.RunRequest) returns (.rx.contract.v1.RunView);
  rpc AbandonRun (.rx.contract.v1.RunRequest) returns (.rx.contract.v1.RunView);
  rpc GetRun (.rx.contract.v1.RunRequest) returns (.rx.contract.v1.RunView);
  rpc ResolveActivation (.rx.contract.v1.ResolveActivation) returns (.rx.contract.v1.ActivationView);
  rpc CommitCheckpoint (.rx.contract.v1.ChangeCheckpoint) returns (.rx.contract.v1.RunView);
}

service AdmissionService {
  rpc EvaluateProfile (.rx.contract.v1.EvaluateProfile) returns (.rx.contract.v1.ProfileEvaluation);
}

service HostService {
  rpc AcquireGrant (.rx.contract.v1.GrantRequest) returns (.rx.contract.v1.Grant);
  rpc RenewGrant (.rx.contract.v1.RenewGrant) returns (.rx.contract.v1.Grant);
  rpc PrepareOperation (.rx.contract.v1.PrepareOperation) returns (.rx.contract.v1.Receipt);
  rpc AuthorizeDispatch (.rx.contract.v1.AuthorizeDispatch) returns (.rx.contract.v1.Receipt);
  rpc GetReceipt (.rx.contract.v1.OperationRef) returns (.rx.contract.v1.Receipt);
  rpc GetCancelReceipt (.rx.contract.v1.CancelRequest) returns (.rx.contract.v1.Receipt);
  rpc CancelOperation (.rx.contract.v1.CancelRequest) returns (.rx.contract.v1.Receipt);
  rpc Reconcile (.rx.contract.v1.OperationRef) returns (.rx.contract.v1.EvidenceBatch);
  rpc WatchObservations (.rx.contract.v1.ObservationQuery) returns (stream .rx.contract.v1.ObservationBatch);
  rpc RevokeGrant (.rx.contract.v1.RevokeGrantRequest) returns (.rx.contract.v1.GrantRevocation);
  rpc CloseControlSession (.rx.contract.v1.CancelRequest) returns (.rx.contract.v1.Receipt);
  rpc NextStreamTicket (.rx.contract.v1.OperationRef) returns (.rx.contract.v1.StreamTicket);
  rpc PushSample (.rx.contract.v1.ControlSample) returns (.rx.contract.v1.Reason);
}

service EvidenceService {
  rpc Publish (.rx.contract.v1.EvidenceBatch) returns (.rx.contract.v1.DurableAck);
  rpc Get (.rx.contract.v1.EvidenceRef) returns (.rx.contract.v1.Evidence);
}

service JournalService {
  rpc GetSnapshot (.rx.contract.v1.SubscribeRequest) returns (.rx.contract.v1.Snapshot);
  rpc GetSnapshotPage (.rx.contract.v1.SnapshotPageRequest) returns (.rx.contract.v1.Snapshot);
  rpc Subscribe (.rx.contract.v1.SubscribeRequest) returns (stream .rx.contract.v1.Event);
}
