syntax = "proto3";
package rx.executor.plan.v1;
import "rx/contract/v1/contract.proto";
// Generated by tools/generate_protocol.py. Preserve contract field numbers.

enum CheckpointAction {
  CHECKPOINT_ACTION_UNSPECIFIED = 0;
  CHECKPOINT_ACTION_CHOOSE_BRANCH = 1;
  CHECKPOINT_ACTION_START_WAIT = 2;
  CHECKPOINT_ACTION_CHECK_WAIT = 3;
}

enum PreparationState {
  PREPARATION_STATE_UNSPECIFIED = 0;
  PREPARATION_STATE_READY = 1;
  PREPARATION_STATE_WAITING = 2;
  PREPARATION_STATE_ALREADY_APPLIED = 3;
}

message PrepareCheckpoint {
  rx.contract.v1.CallContext context = 1;
  string run_id = 2;
  string node_id = 3;
  uint64 visit = 4;
  CheckpointAction action = 5;
  bytes binding_hash = 6;
}

message CheckpointPreparation {
  PreparationState state = 1;
  uint64 expected_revision = 2;
  optional rx.contract.v1.Checkpoint checkpoint = 3;
  optional rx.contract.v1.TimePoint prepared_at = 4;
  optional rx.contract.v1.TimePoint valid_until = 5;
}

service ExecutorPlanService {
  rpc PrepareCheckpoint (.rx.executor.plan.v1.PrepareCheckpoint) returns (.rx.executor.plan.v1.CheckpointPreparation);
}
