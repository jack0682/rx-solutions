syntax = "proto3";
package rx.host.execution.v2;
import "rx/contract/v1/contract.proto";
import "rx/cell/v1/cell.proto";
// Generated by tools/generate_protocol.py. Preserve contract field numbers.

message PrepareExecution {
  rx.cell.v1.HostPrepareRequest request = 1;
  bytes binding_hash = 2;
  rx.contract.v1.ArtifactRef reference = 3;
  bytes payload = 4;
  bytes parameters = 5;
}

message AuthorizeExecution {
  rx.cell.v1.HostAuthorizeRequest request = 1;
  bytes binding_hash = 2;
  bytes operation_binding = 3;
}

message ReadExecution {
  rx.contract.v1.OperationRef request = 1;
  bytes binding_hash = 2;
  bytes operation_binding = 3;
}

message ExecutionReceipt {
  rx.contract.v1.Receipt receipt = 1;
  bytes operation_binding = 2;
}

message ExecutionEvidence {
  rx.contract.v1.EvidenceBatch batch = 1;
  bytes operation_binding = 2;
}

service HostExecutionService {
  rpc Prepare (.rx.host.execution.v2.PrepareExecution) returns (.rx.host.execution.v2.ExecutionReceipt);
  rpc Authorize (.rx.host.execution.v2.AuthorizeExecution) returns (.rx.host.execution.v2.ExecutionReceipt);
  rpc GetReceipt (.rx.host.execution.v2.ReadExecution) returns (.rx.host.execution.v2.ExecutionReceipt);
  rpc Reconcile (.rx.host.execution.v2.ReadExecution) returns (.rx.host.execution.v2.ExecutionEvidence);
}
