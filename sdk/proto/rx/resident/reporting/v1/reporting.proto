syntax = "proto3";
package rx.resident.reporting.v1;
// Generated by tools/generate_protocol.py. Preserve contract field numbers.

message OpenReporter {
  string peer_id = 1;
  string peer_boot = 2;
  string installation_id = 3;
  string store_generation = 4;
  string shared_clock_id = 5;
  bytes release_digest = 6;
  bytes binding_hash = 7;
}

message InspectScope {
  string session_id = 1;
  string scope_id = 2;
  bytes binding_hash = 3;
}

message ReadHead {
  string session_id = 1;
  string scope_id = 2;
  string instance_id = 3;
  bytes binding_hash = 4;
}

message PublishReport {
  string session_id = 1;
  string request_key = 2;
  bytes payload = 3;
  bytes payload_sha256 = 4;
  bytes binding_hash = 5;
}

message Payload {
  string schema = 1;
  bytes data = 2;
  bytes sha256 = 3;
}

service ResidentReportingService {
  rpc Open (.rx.resident.reporting.v1.OpenReporter) returns (.rx.resident.reporting.v1.Payload);
  rpc Inspect (.rx.resident.reporting.v1.InspectScope) returns (.rx.resident.reporting.v1.Payload);
  rpc Head (.rx.resident.reporting.v1.ReadHead) returns (.rx.resident.reporting.v1.Payload);
  rpc Publish (.rx.resident.reporting.v1.PublishReport) returns (.rx.resident.reporting.v1.Payload);
}
